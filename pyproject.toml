[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "Regression testing for LLM outputs: scorers, run comparison, HTML reports, CI gate. Works with any OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "jsonschema>=4.18", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
llm-eval = "llm_eval.cli:main"
llm-eval-web = "llm_eval.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["SIM905"]
